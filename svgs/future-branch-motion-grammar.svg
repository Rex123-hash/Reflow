<svg width="1500" height="560" viewBox="0 0 1500 560" fill="none"
xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Recovery futures motion grammar</title>
<desc id="desc">A visual reference for candidate branch states: dormant, appearing, evaluating, rejected, valid, selected, and converged.</desc>

<text x="70" y="50" fill="#17211C" font-family="Geist, Inter, sans-serif" font-size="25" font-weight="800">FUTURE-BRANCH MOTION GRAMMAR</text>
<text x="70" y="80" fill="#59645D" font-family="Geist, Inter, sans-serif" font-size="15">The route changes meaning through weight, opacity, and continuity—not flashy effects.</text>

<g font-family="Geist, Inter, sans-serif">
  <!-- stage labels -->
  <text x="160" y="130" fill="#838C85" font-size="11.5" font-weight="800" letter-spacing="1.3" text-anchor="middle">DORMANT</text><text x="360" y="130" fill="#838C85" font-size="11.5" font-weight="800" letter-spacing="1.3" text-anchor="middle">APPEARING</text><text x="560" y="130" fill="#838C85" font-size="11.5" font-weight="800" letter-spacing="1.3" text-anchor="middle">EVALUATING</text><text x="760" y="130" fill="#838C85" font-size="11.5" font-weight="800" letter-spacing="1.3" text-anchor="middle">REJECTED</text><text x="960" y="130" fill="#838C85" font-size="11.5" font-weight="800" letter-spacing="1.3" text-anchor="middle">VALID</text><text x="1160" y="130" fill="#838C85" font-size="11.5" font-weight="800" letter-spacing="1.3" text-anchor="middle">SELECTED</text><text x="1360" y="130" fill="#838C85" font-size="11.5" font-weight="800" letter-spacing="1.3" text-anchor="middle">CONVERGED</text>

  <!-- dormant -->
  <g transform="translate(160 250)">
    <circle cy="-45" r="12" fill="#E7EEE7"/>
    <path d="M0 -32V55" stroke="#DDE4DD" stroke-width="2"/>
    <circle cy="70" r="12" fill="#FBF9F3" stroke="#DDE4DD" stroke-width="1.6"/>
  </g>

  <!-- appearing -->
  <g transform="translate(360 250)">
    <circle cy="-45" r="12" fill="#1D4C39"/>
    <path d="M0 -32V55" stroke="#91A995" stroke-width="2.8" stroke-dasharray="8 10"/>
    <circle cy="70" r="12" fill="#FFFDF9" stroke="#91A995" stroke-width="1.8"/>
  </g>

  <!-- evaluating -->
  <g transform="translate(560 250)">
    <circle cy="-45" r="12" fill="#1D4C39"/>
    <path d="M0 -32V55" stroke="#91A995" stroke-width="3"/>
    <circle cy="8" r="5" fill="#B89A64"/>
    <circle cy="70" r="12" fill="#FFFDF9" stroke="#91A995" stroke-width="1.8"/>
  </g>

  <!-- rejected -->
  <g transform="translate(760 250)">
    <circle cy="-45" r="12" fill="#1D4C39"/>
    <path d="M0 -32V55" stroke="#91A995" stroke-width="2.4" stroke-dasharray="4 9" opacity="0.55"/>
    <circle cy="70" r="12" fill="#FFFDF9" stroke="#A76658" stroke-width="2"/>
    <path d="M-4 66L4 74M4 66L-4 74" stroke="#A76658" stroke-width="1.8"/>
  </g>

  <!-- valid -->
  <g transform="translate(960 250)">
    <circle cy="-45" r="12" fill="#1D4C39"/>
    <path d="M0 -32V55" stroke="#1D4C39" stroke-width="3.3"/>
    <circle cy="70" r="12" fill="#FFFDF9" stroke="#1D4C39" stroke-width="2"/>
    <path d="M-4 70L-1 73L5 67" stroke="#1D4C39" stroke-width="1.8"/>
  </g>

  <!-- selected -->
  <g transform="translate(1160 250)">
    <circle cy="-45" r="13" fill="#1D4C39"/>
    <path d="M0 -32V55" stroke="#1D4C39" stroke-width="5"/>
    <circle cy="10" r="5" fill="#B89A64"/>
    <circle cy="70" r="14" fill="#1D4C39"/>
    <path d="M-5 70L-1 74L6 66" stroke="#FFFDF9" stroke-width="2"/>
  </g>

  <!-- converged -->
  <g transform="translate(1360 250)">
    <circle cy="-45" r="13" fill="#1D4C39"/>
    <path d="M0 -32V15C0 35 -20 38 -20 58V70" stroke="#1D4C39" stroke-width="5"/>
    <path d="M0 -32V15C0 35 20 38 20 58V70" stroke="#DDE4DD" stroke-width="2" stroke-dasharray="4 8"/>
    <circle cx="-20" cy="82" r="14" fill="#1D4C39"/>
    <circle cx="20" cy="82" r="10" fill="#FBF9F3" stroke="#DDE4DD" stroke-width="1.6"/>
  </g>
</g>

<!-- guidance -->
<g font-family="Geist, Inter, sans-serif">
  <rect x="70" y="400" width="1360" height="105" rx="22" fill="#FFFDF9" stroke="#DDE4DD" stroke-width="1.5"/>
  <circle cx="105" cy="435" r="5" fill="#B89A64"/>
  <text x="125" y="440" fill="#17211C" font-size="15" font-weight="700">Brass marker</text>
  <text x="255" y="440" fill="#59645D" font-size="14">may move along a candidate while it is being evaluated.</text>
  <circle cx="105" cy="470" r="5" fill="#1D4C39"/>
  <text x="125" y="475" fill="#17211C" font-size="15" font-weight="700">Forest weight</text>
  <text x="255" y="475" fill="#59645D" font-size="14">communicates surviving validity and selected authority.</text>
  <circle cx="815" cy="435" r="5" fill="#A76658"/>
  <text x="835" y="440" fill="#17211C" font-size="15" font-weight="700">Failure/rust</text>
  <text x="950" y="440" fill="#59645D" font-size="14">appears only at the terminal decision, never across the whole route.</text>
  <circle cx="815" cy="470" r="5" fill="#91A995"/>
  <text x="835" y="475" fill="#17211C" font-size="15" font-weight="700">Sage</text>
  <text x="900" y="475" fill="#59645D" font-size="14">is used for de-emphasized, latent, or non-selected topology.</text>
</g>
</svg>
