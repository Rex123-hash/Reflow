<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none"
xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Reflow phase tick system</title>
<desc id="desc">Minimal Detect, Plan, Act, and Verify phase ticks matching the Reflow orbital language.</desc>

<path d="M120 170C310 70 890 70 1080 170" stroke="#C9D3CB" stroke-width="1.8"/>
<path d="M120 190C310 96 890 96 1080 190" stroke="#E7EEE7" stroke-width="10" stroke-linecap="round" opacity="0.55"/>

<g font-family="Geist, Inter, sans-serif" font-weight="700" font-size="14" letter-spacing="2.2" fill="#1D4C39">
  <g transform="translate(210 130)">
    <text x="0" y="-24" text-anchor="middle">PLAN</text>
    <path d="M0 -12V8" stroke="#B89A64" stroke-width="2"/>
    <circle cy="16" r="4.6" fill="#FFFDF9" stroke="#B89A64" stroke-width="2"/>
  </g>
  <g transform="translate(500 94)">
    <text x="0" y="-24" text-anchor="middle">DETECT</text>
    <path d="M0 -12V8" stroke="#B89A64" stroke-width="2"/>
    <circle cy="16" r="4.6" fill="#FFFDF9" stroke="#B89A64" stroke-width="2"/>
  </g>
  <g transform="translate(790 112)">
    <text x="0" y="-24" text-anchor="middle">ACT</text>
    <path d="M0 -12V8" stroke="#B89A64" stroke-width="2"/>
    <circle cy="16" r="4.6" fill="#FFFDF9" stroke="#B89A64" stroke-width="2"/>
  </g>
  <g transform="translate(1010 154)">
    <text x="0" y="-24" text-anchor="middle">VERIFY</text>
    <path d="M0 -12V8" stroke="#B89A64" stroke-width="2"/>
    <circle cy="16" r="4.6" fill="#FFFDF9" stroke="#B89A64" stroke-width="2"/>
  </g>
</g>

<!-- orbit nodes -->
<g>
  <circle cx="350" cy="126" r="12" fill="#FFFDF9" stroke="#91A995" stroke-width="2"/>
  <circle cx="350" cy="126" r="5" fill="#91A995"/>
  <circle cx="650" cy="104" r="12" fill="#FFFDF9" stroke="#91A995" stroke-width="2"/>
  <circle cx="650" cy="104" r="5" fill="#91A995"/>
  <circle cx="925" cy="138" r="12" fill="#FFFDF9" stroke="#91A995" stroke-width="2"/>
  <circle cx="925" cy="138" r="5" fill="#91A995"/>
</g>
</svg>
