# Build only backend/BFF code; use the reviewed, existing source commit as COMMIT_SHA.
# No Slack token is a build argument or substitution. Inject its pinned secret at runtime only.
steps:
  - id: backend
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args: [build, --file, Dockerfile, --build-arg, 'COMMIT_SHA=${COMMIT_SHA}', --tag, '${_BACKEND_IMAGE}', .]
  - id: bff
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args: [build, --file, deployment/p2d/Dockerfile, --build-arg, 'COMMIT_SHA=${COMMIT_SHA}', --tag, '${_BFF_IMAGE}', .]
images:
  - '${_BACKEND_IMAGE}'
  - '${_BFF_IMAGE}'
options:
  logging: CLOUD_LOGGING_ONLY
