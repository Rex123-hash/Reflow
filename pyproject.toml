[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "objective-recovery"
version = "0.1.0"
description = "Deterministic foundation for an autonomous objective recovery engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - hackathon submission" }
authors = [
  { name = "Amaan Khan" },
  { name = "Shristi Rathi" },
]
dependencies = [
    "fastapi==0.141.1",
    "google-adk[gcp]==2.7.1",
    "google-api-core==2.34.0",
    "google-auth==2.57.0",
    "google-cloud-firestore==2.29.0",
    "google-cloud-pubsub>=2.31,<3",
    "google-cloud-secret-manager>=2.25,<3",
    "google-genai==2.19.0",
    "google-auth-oauthlib>=1.2,<2",
    "pydantic>=2.12,<3",
    "requests==2.34.2",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]==2.7.1",
    "google-cloud-aiplatform[evaluation]>=1.165,<2",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/objective_recovery", "objective_recovery_agent"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=objective_recovery --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["cloud: requires explicitly enabled real GCP resources"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
