[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "objective-recovery"
version = "0.1.0"
description = "Deterministic foundation for an autonomous objective recovery engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - hackathon submission" }
authors = [
  { name = "Amaan Khan" },
  { name = "Shristi Rathi" },
]
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/objective_recovery"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=objective_recovery --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
