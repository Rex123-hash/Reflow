<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1096" width="1000" height="1096"
     role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Reflow system architecture</title>
  <desc id="arch-desc">Five deployment bands. A browser served by Firebase Hosting and Firebase Auth sends typed, spoken and shown requests to a same-origin BFF on public Cloud Run, which forwards them with an audience-bound service identity to a private Cloud Run backend. Inside that backend, eight Gemini reasoning agents orchestrated by Google ADK produce structured proposals only; a deterministic core decides; adapters act on Google Calendar, Jira, Slack, GitHub and Gmail. Every external effect is independently read back and compared, then objective invariants are evaluated, and failing invariants reopen the incident and replan. Firestore holds incidents, workflow events, action claims, receipts and evidence.</desc>

  <style>
    .b   { fill: #FFFDF8; stroke: #91A995; stroke-width: 1.2; }
    .bp  { fill: #FFFDF8; stroke: #1D4C39; stroke-width: 1.6; }
    .zl  { font: 700 11.5px system-ui, "Segoe UI", Arial, sans-serif; letter-spacing: 1.7px; fill: #7A5526; }
    .h   { font: 600 16px system-ui, "Segoe UI", Arial, sans-serif; fill: #17211C; }
    .hs  { font: 600 14px system-ui, "Segoe UI", Arial, sans-serif; fill: #1D4C39; }
    .t   { font: 400 13.5px system-ui, "Segoe UI", Arial, sans-serif; fill: #59645D; }
    .ts  { font: 400 12.5px system-ui, "Segoe UI", Arial, sans-serif; fill: #646D67; }
    .p   { font: 500 13px system-ui, "Segoe UI", Arial, sans-serif; fill: #17211C; }
    .pn  { font: 700 12px ui-monospace, Consolas, monospace; fill: #1D4C39; }
    .fl  { font: 500 12.5px system-ui, "Segoe UI", Arial, sans-serif; fill: #7A5526; }
    .ttl { font: 400 27px Georgia, "Times New Roman", serif; fill: #1D4C39; }
    .sub { font: 400 14.5px Georgia, "Times New Roman", serif; fill: #59645D; }
    .em  { font: 700 13px system-ui, "Segoe UI", Arial, sans-serif; fill: #1D4C39; letter-spacing: .4px; }
    .pill    { fill: #E7EEE7; stroke: #1D4C39; stroke-width: 1; stroke-opacity: .30; }
    .pillq   { fill: #F6F3EA; stroke: #91A995; stroke-width: 1; }
    .pillact { fill: #FFFDF8; stroke: #1D4C39; stroke-width: 1.2; }
    .rule { stroke: #B89A64; stroke-width: 1.4; stroke-linecap: round; }
    .fw   { stroke: #1D4C39; stroke-width: 1.8; fill: none; }
    .fs   { stroke: #91A995; stroke-width: 1.6; fill: none; }
    .fb   { stroke: #B89A64; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; }
  </style>

  <defs>
    <marker id="af" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.2 L9 5 L0 8.8 Z" fill="#1D4C39"/>
    </marker>
    <marker id="as" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.2 L9 5 L0 8.8 Z" fill="#91A995"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.2 L9 5 L0 8.8 Z" fill="#B89A64"/>
    </marker>
  </defs>

  <rect width="1000" height="1096" fill="#F6F3EA"/>

  <!-- ============================ masthead ============================ -->
  <g>
    <circle cx="27" cy="34" r="13.5" fill="none" stroke="#1D4C39" stroke-width="2.4"
            stroke-dasharray="52 13" transform="rotate(-90 27 34)"/>
    <circle cx="27" cy="34" r="4.4" fill="#1D4C39"/>
    <circle cx="37.5" cy="24" r="2.6" fill="#B89A64"/>
    <text class="ttl" x="54" y="34">Reflow</text>
    <text class="sub" x="146" y="34">system architecture</text>
    <text class="em" x="54" y="56">GEMINI REASONS · CODE ENFORCES · ADAPTERS ACT · VERIFIER PROVES</text>
    <line class="rule" x1="0" y1="72" x2="1000" y2="72" stroke-dasharray="3 6" stroke-opacity=".55"/>
  </g>

  <!-- ============================ 1. client ============================ -->
  <rect class="b" x="40" y="92" width="920" height="112" rx="16"/>
  <text class="zl" x="60" y="115">CLIENT</text>

  <rect class="pillact" x="60" y="126" width="392" height="60" rx="10"/>
  <text class="h" x="76" y="150">Reflow web app</text>
  <rect class="pill" x="76" y="160" width="70" height="19" rx="9.5"/>
  <text class="pn" x="97" y="173">TYPE</text>
  <rect class="pill" x="154" y="160" width="70" height="19" rx="9.5"/>
  <text class="pn" x="177" y="173">TALK</text>
  <rect class="pill" x="232" y="160" width="70" height="19" rx="9.5"/>
  <text class="pn" x="253" y="173">SHOW</text>
  <text class="ts" x="316" y="174">one console, three inputs</text>

  <rect class="pillq" x="474" y="126" width="232" height="60" rx="10"/>
  <text class="hs" x="490" y="149">Firebase Hosting</text>
  <text class="ts" x="490" y="169">static build · SPA rewrite · CSP</text>

  <rect class="pillq" x="722" y="126" width="218" height="60" rx="10"/>
  <text class="hs" x="738" y="149">Firebase Auth</text>
  <text class="ts" x="738" y="169">Google identity · demo read-only</text>

  <!-- ============================ 2. edge ============================ -->
  <path class="fw" d="M256 204 V232" marker-end="url(#af)"/>
  <text class="fl" x="268" y="223">same-origin request · session cookie only</text>

  <rect class="b" x="40" y="240" width="920" height="98" rx="16"/>
  <text class="zl" x="60" y="263">EDGE</text>
  <text class="h" x="60" y="292">Authenticated BFF</text>
  <text class="ts" x="60" y="312">public Cloud Run</text>

  <rect class="pillq" x="238" y="270" width="164" height="46" rx="9"/>
  <text class="p" x="254" y="290">origin allowlist</text>
  <text class="ts" x="254" y="307">rejects cross-site</text>
  <rect class="pillq" x="414" y="270" width="164" height="46" rx="9"/>
  <text class="p" x="430" y="290">path allowlist</text>
  <text class="ts" x="430" y="307">fixed read/act set</text>
  <rect class="pillq" x="590" y="270" width="164" height="46" rx="9"/>
  <text class="p" x="606" y="290">workspace mode</text>
  <text class="ts" x="606" y="307">live vs demo</text>
  <rect class="pillq" x="766" y="270" width="174" height="46" rx="9"/>
  <text class="p" x="782" y="290">image validation</text>
  <text class="ts" x="782" y="307">type · size · decode</text>

  <!-- ============================ 3. private backend ============================ -->
  <path class="fw" d="M256 338 V378" marker-end="url(#af)"/>
  <text class="fl" x="268" y="356">audience-bound service identity</text>
  <text class="ts" x="268" y="373">no business credential ever reaches the browser</text>

  <rect class="bp" x="40" y="386" width="920" height="424" rx="16"/>
  <text class="zl" x="60" y="409">PRIVATE BACKEND — CLOUD RUN, IAM-ONLY, NO PUBLIC INGRESS</text>

  <!-- side inputs -->
  <rect class="pillq" x="60" y="422" width="424" height="34" rx="8"/>
  <text class="ts" x="76" y="443">Cloud Pub/Sub authenticated push  →  Gmail watch ingestion</text>
  <rect class="pillq" x="516" y="422" width="424" height="34" rx="8"/>
  <text class="ts" x="532" y="443">Secret Manager  →  adapter credentials, backend-side only</text>

  <!-- 3a. reasoning -->
  <rect x="60" y="470" width="880" height="164" rx="12" fill="#FFFDF8" stroke="#B89A64"
        stroke-width="1.6" stroke-dasharray="7 5"/>
  <text class="zl" x="78" y="492">EIGHT REASONING AGENTS — GEMINI 3.7 FLASH ON VERTEX AI, ORCHESTRATED BY GOOGLE ADK</text>

  <g>
    <rect class="pill" x="78" y="504" width="167" height="42" rx="9"/>
    <text class="pn" x="90" y="521">1</text><text class="p" x="104" y="521">disruption</text>
    <text class="p" x="104" y="537">interpreter</text>

    <rect class="pill" x="253" y="504" width="167" height="42" rx="9"/>
    <text class="pn" x="265" y="521">2</text><text class="p" x="279" y="521">impact</text>
    <text class="p" x="279" y="537">analyst</text>

    <rect class="pill" x="428" y="504" width="167" height="42" rx="9"/>
    <text class="pn" x="440" y="521">3</text><text class="p" x="454" y="521">recovery</text>
    <text class="p" x="454" y="537">planner</text>

    <rect class="pill" x="603" y="504" width="167" height="42" rx="9"/>
    <text class="pn" x="615" y="521">4</text><text class="p" x="629" y="521">risk</text>
    <text class="p" x="629" y="537">critic</text>

    <rect class="pill" x="778" y="504" width="144" height="42" rx="9"/>
    <text class="pn" x="790" y="521">5</text><text class="p" x="804" y="521">recovery</text>
    <text class="p" x="804" y="537">analyst</text>
  </g>
  <g>
    <rect class="pill" x="78" y="554" width="273" height="34" rx="9"/>
    <text class="pn" x="90" y="575">6</text><text class="p" x="104" y="575">operator intent interpreter</text>

    <rect class="pill" x="359" y="554" width="273" height="34" rx="9"/>
    <text class="pn" x="371" y="575">7</text><text class="p" x="385" y="575">simulation agent</text>

    <rect class="pill" x="640" y="554" width="282" height="34" rx="9"/>
    <text class="pn" x="652" y="575">8</text><text class="p" x="666" y="575">conversation + image understanding</text>
  </g>
  <text class="ts" x="78" y="612">Structured, schema-validated output only. No tools, no credentials, no execution authority.</text>
  <text class="ts" x="78" y="628">Gemini Live powers spoken turns; it is an interface capability, not a ninth agent.</text>

  <path class="fb" d="M500 634 V664" marker-end="url(#ab)"/>
  <text class="fl" x="512" y="655">a proposal — never an instruction to act</text>

  <!-- 3b. deterministic core + adapters -->
  <rect x="60" y="672" width="486" height="122" rx="12" fill="#E7EEE7" stroke="#1D4C39" stroke-width="1.4"/>
  <text class="zl" x="78" y="694">DETERMINISTIC CORE — DECIDES</text>
  <rect class="pillact" x="78" y="704" width="148" height="28" rx="8"/>
  <text class="p" x="90" y="722">operational graph</text>
  <rect class="pillact" x="234" y="704" width="130" height="28" rx="8"/>
  <text class="p" x="246" y="722">blast radius</text>
  <rect class="pillact" x="372" y="704" width="156" height="28" rx="8"/>
  <text class="p" x="384" y="722">hard policy gate</text>
  <rect class="pillact" x="78" y="740" width="148" height="28" rx="8"/>
  <text class="p" x="90" y="758">plan selection</text>
  <rect class="pillact" x="234" y="740" width="130" height="28" rx="8"/>
  <text class="p" x="246" y="758">state machine</text>
  <rect class="pillact" x="372" y="740" width="156" height="28" rx="8"/>
  <text class="p" x="384" y="758">idempotency keys</text>
  <text class="ts" x="78" y="785">Selects, authorizes, and refuses. The model cannot overrule it.</text>

  <path class="fw" d="M546 733 H586" marker-end="url(#af)"/>
  <text class="fl" x="556" y="724">authorized</text>
  <text class="fl" x="556" y="750">effect only</text>

  <rect x="594" y="672" width="346" height="122" rx="12" fill="#FFFDF8" stroke="#1D4C39" stroke-width="1.4"/>
  <text class="zl" x="612" y="694">ADAPTERS — ACT</text>
  <rect class="pillact" x="612" y="704" width="100" height="28" rx="8"/>
  <text class="p" x="624" y="722">Calendar</text>
  <rect class="pillact" x="720" y="704" width="76" height="28" rx="8"/>
  <text class="p" x="732" y="722">Jira</text>
  <rect class="pillact" x="804" y="704" width="90" height="28" rx="8"/>
  <text class="p" x="816" y="722">Slack</text>
  <rect class="pillact" x="612" y="740" width="100" height="28" rx="8"/>
  <text class="p" x="624" y="758">GitHub</text>
  <rect class="pillq" x="720" y="740" width="174" height="28" rx="8"/>
  <text class="p" x="732" y="758">Gmail · read-only</text>
  <text class="ts" x="612" y="785">Typed intents against a fixed resource allowlist.</text>

  <!-- ============================ 4. systems of record ============================ -->
  <path class="fw" d="M767 810 V844" marker-end="url(#af)"/>
  <text class="fl" x="779" y="833">write</text>

  <rect class="b" x="40" y="852" width="920" height="86" rx="16"/>
  <text class="zl" x="60" y="875">SYSTEMS OF RECORD — THE ONLY PLACE EXTERNAL TRUTH EXISTS</text>
  <rect class="pillq" x="60" y="888" width="168" height="32" rx="8"/>
  <text class="p" x="76" y="909">Google Calendar</text>
  <rect class="pillq" x="238" y="888" width="168" height="32" rx="8"/>
  <text class="p" x="254" y="909">Jira</text>
  <rect class="pillq" x="416" y="888" width="168" height="32" rx="8"/>
  <text class="p" x="432" y="909">Slack</text>
  <rect class="pillq" x="594" y="888" width="168" height="32" rx="8"/>
  <text class="p" x="610" y="909">GitHub</text>
  <rect class="pillq" x="772" y="888" width="168" height="32" rx="8"/>
  <text class="p" x="788" y="909">Gmail</text>

  <!-- read-back returns up into verification -->
  <path class="fs" d="M300 852 V830 H150 V972" marker-end="url(#as)"/>
  <text class="fl" x="160" y="843">independent read-back · a second, separate request</text>

  <!-- ============================ 5. verification + state ============================ -->
  <rect class="b" x="40" y="980" width="556" height="98" rx="16"/>
  <text class="zl" x="60" y="1003">TWO-LAYER VERIFICATION</text>
  <rect class="pillact" x="60" y="1014" width="252" height="30" rx="8"/>
  <text class="p" x="74" y="1034">1 · action read-back compare</text>
  <path class="fw" d="M320 1029 H344" marker-end="url(#af)"/>
  <rect class="pillact" x="352" y="1014" width="224" height="30" rx="8"/>
  <text class="p" x="366" y="1034">2 · objective invariants</text>
  <text class="em" x="60" y="1064">ACTION VERIFIED ≠ OBJECTIVE RECOVERED</text>

  <rect class="b" x="612" y="980" width="348" height="98" rx="16"/>
  <text class="zl" x="632" y="1003">FIRESTORE — DURABLE AUTHORITY</text>
  <text class="t" x="632" y="1026">incidents · revisions · workflow events</text>
  <text class="t" x="632" y="1046">action claims · receipts · evidence</text>
  <text class="ts" x="632" y="1066">Every state change is replayable and idempotent.</text>

  <path class="fw" d="M596 1029 H604" marker-end="url(#af)"/>

  <!-- reopen loop -->
  <path class="fb" d="M40 1029 H20 V498 H70" marker-end="url(#ab)"/>
  <text class="fl" x="26" y="960" transform="rotate(-90 26 960)">invariants fail → reopen the incident and replan</text>

  <!-- ============================ legend ============================ -->
  <g>
    <rect x="612" y="386" width="0" height="0"/>
  </g>
</svg>
